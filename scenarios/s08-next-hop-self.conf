! 情境 8:iBGP next-hop-self(r4 才能解析 next-hop)
! 套用在 pe(AS 65000)。每个情境都是完整配置,切换时 pe 会重启并重新加载。
frr defaults traditional
hostname pe
!
route-map FROM-R3 permit 10
 set local-preference 200
!
route-map PERMIT-ALL permit 10
!
router bgp 65000
 bgp router-id 10.255.0.3
 neighbor 172.30.1.2 remote-as 65001
 neighbor 172.30.1.2 timers 3 9
 neighbor 172.30.1.2 timers connect 5
 neighbor 172.30.2.2 remote-as 65002
 neighbor 172.30.2.2 timers 3 9
 neighbor 172.30.2.2 timers connect 5
 neighbor 172.30.3.2 remote-as 65003
 neighbor 172.30.3.2 timers 3 9
 neighbor 172.30.3.2 timers connect 5
 neighbor 172.30.4.2 remote-as 65000
 neighbor 172.30.4.2 timers 3 9
 neighbor 172.30.4.2 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 172.30.1.2 route-map PERMIT-ALL in
  neighbor 172.30.1.2 route-map PERMIT-ALL out
  neighbor 172.30.2.2 route-map PERMIT-ALL in
  neighbor 172.30.2.2 route-map PERMIT-ALL out
  neighbor 172.30.3.2 route-map FROM-R3 in
  neighbor 172.30.3.2 route-map PERMIT-ALL out
  neighbor 172.30.4.2 next-hop-self
 exit-address-family
!

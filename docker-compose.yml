# BGP route policy lab:pe 為套用 policy 的節點,r1~r3 為 eBGP 對等,r4 為 iBGP 對等
# 所有 link 都是 internal network(不連外、不影響主機路由)
name: frr-bgp-policy-lab
x-router: &router
  image: frrouting/frr:v8.4.1
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  volumes:
    - ./common/daemons:/etc/frr/daemons:ro
    - ./common/vtysh.conf:/etc/frr/vtysh.conf:ro

services:
  pe:
    <<: *router
    container_name: lab-pe
    hostname: pe
    networks:
      n1: {ipv4_address: 172.30.1.3}
      n2: {ipv4_address: 172.30.2.3}
      n3: {ipv4_address: 172.30.3.3}
      n4: {ipv4_address: 172.30.4.3}
  r1:
    <<: *router
    container_name: lab-r1
    hostname: r1
    networks: {n1: {ipv4_address: 172.30.1.2}}
  r2:
    <<: *router
    container_name: lab-r2
    hostname: r2
    networks: {n2: {ipv4_address: 172.30.2.2}}
  r3:
    <<: *router
    container_name: lab-r3
    hostname: r3
    networks: {n3: {ipv4_address: 172.30.3.2}}
  r4:
    <<: *router
    container_name: lab-r4
    hostname: r4
    networks: {n4: {ipv4_address: 172.30.4.2}}

networks:
  n1: {internal: true, ipam: {config: [{subnet: 172.30.1.0/24}]}}
  n2: {internal: true, ipam: {config: [{subnet: 172.30.2.0/24}]}}
  n3: {internal: true, ipam: {config: [{subnet: 172.30.3.0/24}]}}
  n4: {internal: true, ipam: {config: [{subnet: 172.30.4.0/24}]}}

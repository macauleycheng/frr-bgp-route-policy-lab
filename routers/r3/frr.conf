! r3(AS 65003):固定的對等節點設定,不含實驗用 policy(僅關閉 ebgp-requires-policy 以便單純發送路由)
frr defaults traditional
hostname r3
!
ip route 30.0.0.0/24 blackhole
ip route 40.0.0.0/24 blackhole
!
router bgp 65003
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 neighbor 172.30.3.3 remote-as 65000
 neighbor 172.30.3.3 timers 3 9
 neighbor 172.30.3.3 timers connect 5
 !
 address-family ipv4 unicast
  network 30.0.0.0/24
  network 40.0.0.0/24
 exit-address-family
!

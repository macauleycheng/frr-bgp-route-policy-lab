! r1(AS 65001):固定的對等節點設定,不含實驗用 policy(僅關閉 ebgp-requires-policy 以便單純發送路由)
frr defaults traditional
hostname r1
!
ip route 10.1.0.0/24 blackhole
ip route 10.1.1.0/24 blackhole
ip route 10.1.2.0/24 blackhole
ip route 192.0.2.0/24 blackhole
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 172.30.1.3 remote-as 65000
 neighbor 172.30.1.3 timers 3 9
 neighbor 172.30.1.3 timers connect 5
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  network 10.1.1.0/24
  network 10.1.2.0/24
  network 192.0.2.0/24
 exit-address-family
!

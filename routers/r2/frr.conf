! r2(AS 65002):固定的对等节点配置,不含实验用 policy(仅关闭 ebgp-requires-policy 以便单纯发送路由)
frr defaults traditional
hostname r2
!
ip route 20.0.0.0/24 blackhole
ip route 20.0.1.0/24 blackhole
ip route 30.0.0.0/24 blackhole
!
ip prefix-list MARK seq 5 permit 20.0.1.0/24
!
route-map TO-PE permit 10
 match ip address prefix-list MARK
 set as-path prepend 65099 65088
route-map TO-PE permit 20
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.2.3 remote-as 65000
 neighbor 172.30.2.3 timers 3 9
 neighbor 172.30.2.3 timers connect 5
 !
 address-family ipv4 unicast
  network 20.0.0.0/24
  network 20.0.1.0/24
  network 30.0.0.0/24
  neighbor 172.30.2.3 route-map TO-PE out
 exit-address-family
!
